# Render Blueprint：在 Render 中一键创建「拾光」服务端所需的资源（全部免费项）。
# 使用方式：Render Dashboard -> New -> Blueprint -> 连接本仓库。
#
# 资源说明：
#   1. shiguang-server   —— Spring Boot 后端（Docker，免费 Web 服务）
#   2. shiguang-redis    —— Redis / Render Key Value（免费档，仅存验证码等临时数据）
#
# 数据库使用第三方免费 TiDB Cloud（MySQL 兼容，建库建表已执行完成）。
# 敏感信息（TiDB 连接信息、SMTP、JPush）在首次创建 Blueprint 时由 Render 提示填写，
# 不会写入仓库明文。免费 Web 服务无法对外发送 465/587 端口的 SMTP 邮件，
# 如需真实发送邮箱验证码，请把 shiguang-server 升级为付费档或改用 HTTP 邮件服务。

services:
  - type: web
    name: shiguang-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SHIGUANG_DEV_MODE
        value: "false"

      # JWT 密钥由 Render 自动生成并持久化，无需手填
      - key: SHIGUANG_JWT_SECRET
        generateValue: true

      # 第三方 TiDB Cloud（MySQL 兼容），连接信息在创建 Blueprint 时填写
      - key: SHIGUANG_DB_HOST
        sync: false
      - key: SHIGUANG_DB_PORT
        value: "4000"
      - key: SHIGUANG_DB_USERNAME
        sync: false
      - key: SHIGUANG_DB_PASSWORD
        sync: false
      - key: SHIGUANG_DB_SSL_MODE
        value: "REQUIRED"

      # Redis：通过 Key Value 服务引用自动注入
      - key: SHIGUANG_REDIS_HOST
        fromService:
          name: shiguang-redis
          type: keyvalue
          property: host
      - key: SHIGUANG_REDIS_PORT
        fromService:
          name: shiguang-redis
          type: keyvalue
          property: port

      # SMTP 邮箱验证码（QQ/163/Gmail 等）；留空则生产模式下发码会报错
      - key: SHIGUANG_MAIL_HOST
        sync: false
      - key: SHIGUANG_MAIL_PORT
        sync: false
      - key: SHIGUANG_MAIL_USERNAME
        sync: false
      - key: SHIGUANG_MAIL_PASSWORD
        sync: false
      - key: SHIGUANG_MAIL_FROM
        sync: false

      # 极光 JPush（可选；未配置时推送仅记日志，不真实发送）
      - key: SHIGUANG_JPUSH_APP_KEY
        sync: false
      - key: SHIGUANG_JPUSH_MASTER_SECRET
        sync: false
      - key: SHIGUANG_JPUSH_APNS_PRODUCTION
        sync: false

  - type: keyvalue
    name: shiguang-redis
    plan: free
